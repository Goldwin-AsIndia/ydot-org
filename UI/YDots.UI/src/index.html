  <!-- Browser chrome colour. #375c4c is the default theme's derived primary; the blocking script below
       and ThemeColorService.apply() keep it in step with --theme-primary. -->
  <meta name="theme-color" content="#375c4c">
  <link rel="icon" type="image/x-icon" sizes="48x48" href="assets/images/Outlineydotlogo.ico">

  <!-- Application fonts, SELF-HOSTED.
       Outfit is the default app font; Inter, Quicksand, Playfair Display, Source Serif 4 and the
       two IBM Plex families are used by individual screens. All seven are served from
       assets/fonts/ rather than from fonts.googleapis.com, for three reasons: the Angular build
       inlines remote fonts at COMPILE time and that fetch failing breaks the Docker image build
       outright; a linked font leaves the application half-styled for anyone who cannot reach
       Google; and requesting one discloses every visitor's IP address to a third party, which on
       a platform holding donor records is a data-protection question rather than a performance
       one.
       Regenerate with scratchpad/fetch_fonts.py. -->
  <link href="assets/fonts/fonts.css" rel="stylesheet">

  <!-- Theme colour, applied BEFORE first paint (blocking on purpose: do not add defer/async).
       ThemeColorService caches the derived --theme-* variables in localStorage next to the chosen
       colour; replaying them here means the header never flashes the default green before Angular
       boots. Keep the version in step with PALETTE_CACHE_VERSION in theme-color.service.ts. A missing
       or stale cache just falls back to the defaults in styles/ydot-theme.css for one frame. -->
  <script>
    (function () {
      try {
        var color = localStorage.getItem('theme:color');
        var cache = JSON.parse(localStorage.getItem('theme:palette') || 'null');
        if (color && cache && cache.v === 7 && cache.color === color && cache.vars) {
          var style = document.documentElement.style;
          for (var name in cache.vars) { style.setProperty(name, cache.vars[name]); }
          var chrome = document.querySelector('meta[name="theme-color"]');
          if (chrome && cache.vars['--primary']) { chrome.setAttribute('content', cache.vars['--primary']); }
        }
      } catch (e) { /* storage blocked: the CSS defaults apply */ }
    })();
  </script>

     This used to load Razorpay Checkout on every page of the application. Two things were wrong
     with that. It named ONE provider in a platform where each organisation configures its own,
     so an organisation on any other gateway still paid the download; and it handed Razorpay a
     page view from every visitor to every screen, most of whom are never going to donate.

@if(open && data){
<div class="modal-overlay">
    <div class="success-modal">
        <div class="success-icon">
            <i class="ri-checkbox-circle-line"></i>
        </div>
        <h3>{{ data.title }}</h3>
        <p class="text-muted">{{ data.message }}</p>
        <div class="details">
            @if(data.referenceId){
            <div class="mb-3">
                <small>Reference ID</small>
                <div class="fw-semibold">{{ data.referenceId }}</div>
            </div>
            }
            @if(data.effectiveTime){
            <div class="mb-3">
                <small>Effective Time</small>
                <div>{{ data.effectiveTime }}</div>
            </div>
            }
            @if(data.sessionsNote){
            <div>
                <small>Sessions</small>
                <div>{{ data.sessionsNote }}</div>
            </div>
            }
        </div>
        <button class="btn btn-primary w-100 mt-4" (click)="onAction()">
            {{ data.buttonLabel || 'Go to Sign In' }}
        </button>
    </div>
</div>
}

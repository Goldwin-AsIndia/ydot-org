<span class="themed-logo"
      [style.--logo-size.px]="size()"
      [attr.role]="label() ? 'img' : null"
      [attr.aria-label]="label() || null"
      [attr.aria-hidden]="label() ? null : 'true'">
  <!-- Relative URL on purpose: an inline style resolves against <base href>, which a url() in the
       stylesheet would not (the build would try to bundle it instead). -->
  <span class="themed-logo__mark"
        style="-webkit-mask-image: url(assets/images/ydot-mark-mask.png); mask-image: url(assets/images/ydot-mark-mask.png);"></span>
</span>

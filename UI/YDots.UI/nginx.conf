server {
    listen       80;
    listen       [::]:80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    # =============================================================================================
    # HEADER BUFFERS, sized for this platform's tokens.
    #
    # WHY THIS IS NOT OPTIONAL. An access token carries every permission the caller holds as its
    # own claim. An Organisation Administrator holds 220 of them, which makes a 9.2 KB token and an
    # Authorization header larger than nginx's default 8 KB buffer. The symptom is vicious: sign-in
    # succeeds, because that request carries no Authorization header, and then EVERY authenticated
    # request afterwards is rejected by nginx with
    #
    #     400 Request Header Or Cookie Too Large
    #
    # before it ever reaches the API. Nothing appears in the application logs, because nothing
    # reached the application. The more senior the user, the more certainly it happens - so the
    # people most likely to be demonstrating the platform are the ones who cannot use it.
    #
    # 32k gives roughly three times the current worst case, which leaves room for the permission
    # catalogue to grow without this reappearing.
    # =============================================================================================
    large_client_header_buffers 8 32k;
    client_header_buffer_size   8k;

    # =============================================================================================
    # REQUEST BODY SIZE, sized for the document upload the API actually accepts.
    #
    # nginx's default client_max_body_size is 1m. The IAM API advertises its own limit through
    # GET /organisations/document-upload-policy - 5 MB per file - and enforces exactly that in the
    # upload handler, with a 64 MB hard ceiling on the endpoint. So every file between 1 MB and
    # 5 MB was refused BY THE PROXY, before the API saw a byte of it, while the drop zone directly
    # above the file picker read "PDF, PNG, JPEG or Word - up to 5 MB each". A scanned registration
    # certificate is almost always in that band, which made the one document the platform actually
    # requires the one document that could not be uploaded.
    #
    # 8m rather than 5m: a multipart body is the file plus its boundaries and headers, and a
    # proxy limit set exactly at the file limit refuses a file of exactly the permitted size. The
    # API remains the authority on what is allowed - this only stops nginx refusing first.
    # =============================================================================================
    client_max_body_size 8m;
    client_body_buffer_size 256k;

    # A 413 from nginx is an HTML page, and the client parses every API failure as the JSON
    # envelope - so the one refusal a person most needs explained arrived as a parse error and
    # surfaced as "the file could not be uploaded" with no reason. This answers in the envelope
    # the interceptor already reads.
    error_page 413 = @payload_too_large;

    # =============================================================================================
    # GATEWAY FAILURES ANSWER IN THE API'S OWN ENVELOPE.
    #
    # When a service is stopped or still starting, nginx's stock 502/503/504 page is HTML. Two
    # things are wrong with that. The client parses every API failure as
    # {success, message, errorCode, correlationId} and gets a document instead, so the one case
    # where a clear message matters most is the one case that does not carry one. And the stock
    # page prints the nginx version, which tells a stranger which CVEs to try.
    #
    # server_tokens off removes the version from both the page and the Server header. The named
    # location below returns the envelope the interceptor already knows how to read, so a stopped
    # container surfaces as "the service is temporarily unavailable" rather than as a parse error.
    # =============================================================================================
    server_tokens off;

    error_page 502 503 504 = @api_unavailable;

    location @api_unavailable {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 503 '{"success":false,"data":null,"message":"That service is temporarily unavailable. Try again in a moment.","errorCode":"SERVICE_UNAVAILABLE","errors":null,"correlationId":null}';
    }

    location @payload_too_large {
        internal;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 413 '{"success":false,"data":null,"message":"That file is too large to upload. The limit is 5 MB per file.","errorCode":"PAYLOAD_TOO_LARGE","errors":null,"correlationId":null}';
    }

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

    # Third-party assets are copied verbatim (no content hash), so cache them
    # for a week only. ^~ keeps this ahead of the regex block below.
    location ^~ /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Angular's own output is content-hashed (outputHashing: all) — cache forever.
    location ~* \.(?:js|css|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # The app shell must never be cached or users get stranded on an old build.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Reverse proxy to the IAM API. The bundle calls /api/v1/... on its own
    # origin, so there is no CORS preflight and no API host baked into the build.
    location /api/ {
        # Docker's embedded DNS, re-resolved every 10s. Combined with the
        # variable below this lets nginx boot even when the API is not up yet,
        # and pick up a new container IP after the API restarts.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $iam_api "ydot-iam:8080";

        # proxy_pass with a variable and no URI part forwards the original path
        # unchanged, so /api/v1/users/sign-in reaches the API as-is.
        proxy_pass http://$iam_api;

        proxy_http_version 1.1;
        proxy_buffer_size          32k;
        proxy_buffers           8  32k;
        proxy_busy_buffers_size    64k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # The first request after a cold start can wait on migrations and seeding.
        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # ---------------------------------------------------------------------------
    # The other three services.
    #
    # WHY A PREFIX AND A REWRITE rather than a second host in the bundle. Keeping every
    # call same-origin means no CORS preflight on any request, no API host compiled into
    # the JavaScript, and one image that runs on any host or port without a rebuild - the
    # same reasons the IAM block above exists.
    #
    # THE REWRITE IS WHAT MAKES THE PREFIX INVISIBLE TO THE SERVICE. The browser calls
    # /cam-api/v1/campaigns; CAM routes on /api/v1/campaigns and knows nothing about the
    # prefix. `rewrite ... break` stops further rewriting and hands the new URI to
    # proxy_pass, which forwards it unchanged because it has a variable and no URI part.
    # ---------------------------------------------------------------------------

    location /cam-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $cam_api "ydot-cam:8080";

        rewrite ^/cam-api/(.*)$ /api/$1 break;
        proxy_pass http://$cam_api;

        proxy_http_version 1.1;
        proxy_buffer_size          32k;
        proxy_buffers           8  32k;
        proxy_busy_buffers_size    64k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    location /don-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $don_api "ydot-don:8080";

        rewrite ^/don-api/(.*)$ /api/$1 break;
        proxy_pass http://$don_api;

        proxy_http_version 1.1;
        proxy_buffer_size          32k;
        proxy_buffers           8  32k;
        proxy_busy_buffers_size    64k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # Payments. THE X-Real-IP HEADER MATTERS MORE HERE than on the other three: the
    # payments audit trail records the caller's address against every donation, and a
    # public donation has no user to record instead. Without this every row would say the
    # request came from the nginx container.
    location /pay-api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $pay_api "ydot-pay:8080";

        rewrite ^/pay-api/(.*)$ /api/$1 break;
        proxy_pass http://$pay_api;

        proxy_http_version 1.1;
        proxy_buffer_size          32k;
        proxy_buffers           8  32k;
        proxy_busy_buffers_size    64k;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout   120s;
        proxy_read_timeout   120s;
    }

    # Single-page app: unknown paths are client-side routes (e.g. /app/dashboard),
    # so hand them index.html instead of a 404 on hard refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
